name: ci

# Fast feedback on every push and pull request: unit tests + workflow lint
# (no browser needed).
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # A malformed workflow file is silently *not registered* by GitHub, so
      # the breakage is invisible until you check the Actions tab.  Lint it
      # with the official download script (runner-native binary - the
      # docker:// step inherits the image's own WORKDIR instead of the
      # checkout, which made auto-detection fail).
      - name: Lint workflow files
        run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) latest .
          ./actionlint -color
        shell: bash

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Run unit tests
        run: python -m pytest -q

      - name: Import check
        run: python -c "import solver.app, solver.browser; print(solver.app.__version__ if hasattr(solver.app, '__version__') else 'ok')"
